name: Generate Stats

on:
  # Refresh daily, an hour after the snake so the two jobs don't overlap
  schedule:
    - cron: "0 4 * * *"
  # Let you trigger it by hand from the Actions tab (needed for the first run)
  workflow_dispatch:

# The job commits the regenerated cards back to the default branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Render activity cards (dark + light)
        env:
          # STATS_TOKEN is a classic PAT with the `repo` scope. Without it the
          # API reports public activity only, and contributions in private
          # repositories are left out — see SETUP.md.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 .github/scripts/render_stats.py

      - name: Commit if the numbers changed
        run: |
          if [ -z "$(git status --porcelain assets/stats.svg assets/stats-light.svg)" ]; then
            echo "Numbers unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-light.svg
          git commit -m "chore: refresh activity card"
          git push
