<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" fill="none" role="img" aria-label="GitHub activity for the last 12 months">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(150 120) rotate(0) scale(560 300)">
      <stop offset="0" stop-color="#c5d642" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#c5d642" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#c5d642" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.028"/>
    </pattern>
  </defs>

  <rect width="1200" height="240" fill="#0a0a0a"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect width="1200" height="240" fill="url(#glow)"/>

  <rect x="128" y="52" width="4" height="36" rx="2" fill="#c5d642"/>
