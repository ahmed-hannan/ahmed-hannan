      <stop offset="0.55" stop-color="#586b0d" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#586b0d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
